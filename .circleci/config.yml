version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:20.10
    
jobs:
  install-deps:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
            - package.json
            - package-lock.json
            - index.html
            - src
            - public

  build:
    executor: node-executor
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Build the project
          command: npm run build  
      - persist_to_workspace:
          root: .
          paths:
            - dist  

  deploy:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install Python and pip
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip
      - run:
          name: Install AWS EB CLI
          command: |
            pip3 install --upgrade pip
            pip3 install awsebcli --upgrade --user
            export PATH=$HOME/.local/bin:$PATH
      - run:
          name: Deploy to AWS Elastic Beanstalk
          command: |
            export PATH=$HOME/.local/bin:$PATH
            eb init aws-app --platform node.js --region us-west-2
              eb use aws-env
            eb deploy
      - run:
          name: fetch and print the URL of the deployed application
          command: |
            export PATH=$HOME/.local/bin:$PATH
            echo "Deployed app URL:"
            eb status aws-env | grep CNAME | awk '{print $2}'

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - install-deps
      - build:
          requires:
            - install-deps
      - deploy:
          requires:
            - build
